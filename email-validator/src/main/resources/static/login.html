<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Validateur d'Emails</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f5f5f5;
            color: #2a2a2a;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0a2a5e 0%, #4682b4 100%);
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
            color: #0a2a5e;
            font-size: 24px;
        }
        .logo {
            margin-bottom: 20px;
            color: #0a2a5e;
            font-size: 32px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #0a2a5e;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #d3d3d3;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #4682b4;
            box-shadow: 0 0 8px rgba(70, 130, 180, 0.3);
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: #4682b4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #356ea8;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(70, 130, 180, 0.3);
        }
        #result {
            margin-top: 15px;
            font-weight: 600;
            padding: 10px;
            border-radius: 4px;
        }
        .valid {
            color: #27ae60;
            background-color: #e8f5e9;
        }
        .invalid {
            color: #e74c3c;
            background-color: #ffebee;
        }
        .info {
            color: #3498db;
            background-color: #e3f2fd;
        }
        .demo-credentials {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 6px;
            text-align: left;
            font-size: 14px;
        }
        .demo-credentials h3 {
            margin-bottom: 10px;
            color: #0a2a5e;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <i class="fas fa-envelope"></i>
    </div>
    <h2>Connexion</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" placeholder="Entrez votre nom d'utilisateur" required>
        </div>
        <div class="input-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>
        </div>
        <button type="submit">Se connecter <i class="fas fa-sign-in-alt"></i></button>
    </form>
    <div id="result"></div>

    <div class="demo-credentials">
        <h3>Identifiants de démonstration:</h3>
        <p><strong>Utilisateur:</strong> admin</p>
        <p><strong>Mot de passe:</strong> admin123</p>
    </div>

    <div class="footer">
        <p>Validateur d'Emails Universitaire &copy; 2023</p>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const resultDiv = document.getElementById('result');

        // Afficher un indicateur de chargement
        resultDiv.innerHTML = 'Connexion en cours... <i class="fas fa-spinner fa-spin"></i>';
        resultDiv.className = 'info';

        // Simuler un délai de connexion
        setTimeout(() => {
            // Validation avec les bons identifiants
            if (username === 'admin' && password === 'admin123') {
                resultDiv.innerHTML = 'Connexion réussie! Redirection...';
                resultDiv.className = 'valid';

                // Stocker l'état de connexion dans le localStorage
                localStorage.setItem('isAuthenticated', 'true');
                localStorage.setItem('username', username);

                // Rediriger vers la page principale après un court délai
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                resultDiv.innerHTML = 'Nom d\'utilisateur ou mot de passe incorrect';
                resultDiv.className = 'invalid';
            }
        }, 1500);
    });

    // Vérifier les paramètres d'URL pour les messages
    const urlParams = new URLSearchParams(window.location.search);
    const resultDiv = document.getElementById('result');

    if (urlParams.has('error')) {
        resultDiv.innerHTML = 'Nom d\'utilisateur ou mot de passe incorrect';
        resultDiv.className = 'invalid';
    }
    if (urlParams.has('logout')) {
        resultDiv.innerHTML = 'Déconnexion réussie';
        resultDiv.className = 'valid';
    }
    if (urlParams.has('auth')) {
        resultDiv.innerHTML = 'Veuillez vous connecter pour accéder à l\'application';
        resultDiv.className = 'invalid';
    }
</script>
</body>
</html>
